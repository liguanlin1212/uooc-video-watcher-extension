<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UOOC 提醒</title>
    <link rel="stylesheet" href="alert.css">
  </head>
  <body>
    <main class="app">
      <p class="eyebrow">UOOC Video Watcher</p>
      <h1 id="alertTitle">视频状态提醒</h1>
      <p id="alertMessage" class="message">正在加载提醒内容...</p>
      <p id="alertProgress" class="progress"></p>
      <div class="actions">
        <button id="openTabButton" type="button">打开对应视频</button>
        <button id="closeButton" class="secondary" type="button">关闭提醒</button>
      </div>
    </main>
    <script src="alert.js" type="module"></script>
  </body>
</html>
